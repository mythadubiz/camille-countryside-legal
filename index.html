        * { margin: 0; padding: 0; box-sizing: border-box; }

            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
        }
        .header {
            background: linear-gradient(135deg, #2D5016 0%, #5A8F3C 100%);

            color: white;
        }
        .header img {
            width: 100px;

            border-radius: 16px;

            margin-bottom: 20px;

        }
        .card h2 {
            font-size: 1.3em;
            margin-bottom: 12px;
            color: #2D5016;
        }
        .card a {
            display: block;
            padding: 16px 20px;
            background: #f5f5f7;
            border-radius: 12px;
            text-decoration: none;
            color: #2D5016;
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        .card a:hover { background: #e8e8ed; }
        .card a span {
            float: right;
            opacity: 0.4;
        }
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #86868b;
            font-size: 0.85em;
